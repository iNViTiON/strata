name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      main_tip:
        description: "Sync to the tip of upstream main instead of its latest stable release"
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: https://github.com/lgse/strata.git
  MIRROR_BRANCH: main
  DEV_BRANCH: nix-dev
  ISSUE_LABEL: sync-conflict

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the fork with the sync token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          ref: ${{ env.DEV_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        id: refs
        env:
          MAIN_TIP: ${{ inputs.main_tip }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags origin "$MIRROR_BRANCH" "$DEV_BRANCH"
          if [[ "$MAIN_TIP" == true ]]; then
            git fetch --no-tags upstream "$MIRROR_BRANCH"
            target="$(git rev-parse "upstream/$MIRROR_BRANCH")"
            label="upstream $MIRROR_BRANCH"
          else
            # Stable releases only: plain vX.Y.Z, no -rc or -nightly suffix.
            tag="$(git ls-remote --tags --refs upstream 'v*' \
              | sed 's|.*refs/tags/||' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -n 1)"
            if [[ -z "$tag" ]]; then
              echo "::error::Upstream has no stable release tag."
              exit 1
            fi
            git fetch --no-tags upstream "+refs/tags/$tag:refs/tags/upstream/$tag"
            target="$(git rev-parse "refs/tags/upstream/$tag^{commit}")"
            label="upstream $tag"
          fi
          old_main="$(git rev-parse "origin/$MIRROR_BRANCH")"
          changed=true
          if [[ "$old_main" == "$target" ]]; then
            changed=false
          elif git merge-base --is-ancestor "$target" "$old_main"; then
            echo "::notice::$MIRROR_BRANCH is already past $label; nothing to sync."
            changed=false
          fi
          {
            echo "old_main=$old_main"
            echo "new_main=$target"
            echo "old_dev=$(git rev-parse "origin/$DEV_BRANCH")"
            echo "label=$label"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

      - name: Rebase the dev branch onto the sync target
        id: rebase
        if: steps.refs.outputs.changed == 'true'
        env:
          OLD_MAIN: ${{ steps.refs.outputs.old_main }}
          NEW_MAIN: ${{ steps.refs.outputs.new_main }}
          OLD_DEV: ${{ steps.refs.outputs.old_dev }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$OLD_MAIN" "$NEW_MAIN"; then
            echo "reason=diverged" >> "$GITHUB_OUTPUT"
            echo "::error::The fork's $MIRROR_BRANCH has commits that are not in the sync target."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$OLD_DEV"
          if ! git rebase --onto "$NEW_MAIN" "$OLD_MAIN" > rebase.log 2>&1; then
            cat rebase.log
            {
              echo "reason=conflict"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
              echo "commit=$(git rev-parse --verify --quiet REBASE_HEAD || echo unknown)"
            } >> "$GITHUB_OUTPUT"
            git rebase --abort
            exit 1
          fi
          git push --atomic \
            "--force-with-lease=refs/heads/$DEV_BRANCH:$OLD_DEV" \
            "--force-with-lease=refs/heads/$MIRROR_BRANCH:$OLD_MAIN" \
            origin "$NEW_MAIN:refs/heads/$MIRROR_BRANCH" "HEAD:refs/heads/$DEV_BRANCH"

      - name: Report the failed sync in an issue
        if: failure() && steps.rebase.outputs.reason != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.rebase.outputs.reason }}
          FILES: ${{ steps.rebase.outputs.files }}
          COMMIT: ${{ steps.rebase.outputs.commit }}
          OLD_MAIN: ${{ steps.refs.outputs.old_main }}
          NEW_MAIN: ${{ steps.refs.outputs.new_main }}
          OLD_DEV: ${{ steps.refs.outputs.old_dev }}
          LABEL: ${{ steps.refs.outputs.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --color B60205 --description "Upstream sync needs manual help" --force
          if [[ "$REASON" == diverged ]]; then
            summary="\`$MIRROR_BRANCH\` in this fork is not an ancestor of $LABEL, so it cannot be fast-forwarded. It must mirror upstream exactly; reset it to upstream by hand."
          else
            summary="Rebasing \`$DEV_BRANCH\` onto $LABEL conflicted while applying \`$COMMIT\`. Nothing was pushed.

          Conflicting files:
          \`\`\`
          $FILES
          \`\`\`"
          fi
          body="$summary

          | | SHA |
          | --- | --- |
          | fork \`$MIRROR_BRANCH\` | \`$OLD_MAIN\` |
          | $LABEL | \`$NEW_MAIN\` |
          | fork \`$DEV_BRANCH\` | \`$OLD_DEV\` |

          Resolve locally:
          \`\`\`bash
          git fetch --tags upstream && git fetch origin
          git switch $DEV_BRANCH && git reset --keep origin/$DEV_BRANCH
          git rebase --onto $NEW_MAIN $OLD_MAIN
          # fix conflicts, git add, git rebase --continue
          git push --atomic --force-with-lease=$DEV_BRANCH:$OLD_DEV origin $NEW_MAIN:$MIRROR_BRANCH $DEV_BRANCH
          \`\`\`

          Run: $RUN_URL"
          existing="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body "$body"
            gh issue comment "$existing" --body "Sync failed again: $RUN_URL"
          else
            gh issue create --title "Upstream sync failed ($REASON)" --label "$ISSUE_LABEL" --body "$body"
          fi

      - name: Close resolved sync issues
        if: success() && steps.rebase.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Sync succeeded: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
