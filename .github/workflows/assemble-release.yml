name: Assemble fork release

# Rebuilds `release` = nix-dev + the branches in .release/branches (see NIX.md).
# A `push` trigger on the feature branches cannot work: GitHub reads push
# triggers from the pushed branch's own copy of this file, and feature branches
# come from main, which never contains it. The schedule picks their pushes up.
on:
  workflow_run:
    workflows: [Sync upstream]
    types: [completed]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published manifest already matches
        type: boolean
        default: false

concurrency:
  group: assemble-release
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  DEV_BRANCH: nix-dev
  RELEASE_BRANCH: release
  ISSUE_LABEL: release-failed

jobs:
  # Merges only. The result goes to `release-candidate`, and the jobs below
  # check and build that commit in parallel; `publish` moves `release` to it
  # once all of them pass.
  assemble:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.assemble.outputs.changed }}
      sha: ${{ steps.assemble.outputs.sha }}
      tag: ${{ steps.assemble.outputs.tag }}
      version_tag: ${{ steps.assemble.outputs.version_tag }}
      published: ${{ steps.assemble.outputs.published }}
    steps:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows.
      - name: Check out the fork with the sync token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_PAT }}
          persist-credentials: true
          ref: ${{ env.DEV_BRANCH }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Assemble the release candidate
        id: assemble
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach
          args=(--source origin --candidate)
          [[ "$FORCE" == true ]] || args+=(--if-changed)
          set +e
          # The pinned git brings contrib/rerere-train.sh, which the runner's may lack.
          # shellcheck disable=SC2016
          nix shell --inputs-from . nixpkgs#git -c bash -c '
            export GIT_RERERE_TRAIN="$(git --exec-path)/../../share/git/contrib/rerere-train.sh"
            test -f "$GIT_RERERE_TRAIN" && exec .release/assemble.sh "$@"
          ' assemble "${args[@]}" 2>&1 | tee assemble.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report the failed release in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.assemble.outputs.status }}
          BRANCH: ${{ steps.assemble.outputs.conflict_branch }}
          FILES: ${{ steps.assemble.outputs.conflict_files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --color B60205 --description "Fork release assembly needs manual help" --force
          case "$STATUS" in
            2) summary="Merging \`$BRANCH\` conflicts in:
          \`\`\`
          $FILES
          \`\`\`
          Resolve it once locally; rerere records it, and publishing the rebuilt release lets this workflow replay it:
          \`\`\`bash
          cd <release worktree>
          mise run release -- --source origin      # stops at the conflict
          # fix the files, git add, git commit --no-edit
          mise run release -- --source origin --checks local --publish
          gh workflow run assemble-release.yml -R ${{ github.repository }} --ref $DEV_BRANCH -f force=true
          \`\`\`
          The last command has CI rebuild it, so the release also reaches Cachix and GitHub Releases." ;;
            3) summary="The assembled release failed its checks. See the run log." ;;
            4) summary="Publishing was refused (\`$RELEASE_BRANCH\` moved during the run, or a branch is missing)." ;;
            *) summary="Assembly failed before or outside the merge (exit \`${STATUS:-unknown}\`). A listed branch may be missing on origin." ;;
          esac
          log="$(tail -n 60 assemble.log 2> /dev/null || true)"
          body="$summary

          \`$RELEASE_BRANCH\` was left untouched.

          <details><summary>Last lines of the log</summary>

          \`\`\`
          $log
          \`\`\`
          </details>

          Run: $RUN_URL"
          existing="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body "$body"
            gh issue comment "$existing" --body "Release assembly failed again: $RUN_URL"
          else
            gh issue create --title "Fork release assembly failed" --label "$ISSUE_LABEL" --body "$body"
          fi

  checks:
    needs: assemble
    if: needs.assemble.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      # In the background: the deletion takes minutes, and the space is only
      # needed once the quality image arrives.
      - name: Free disk space for the quality image
        run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - name: Run upstream's pinned-container quality checks
        env:
          STRATA_CONTAINER_ENGINE: docker
        run: ./scripts/quality.sh all

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Run deny, typos and the script tests
        run: |
          set -euo pipefail
          for task in deny typos scripts; do nix develop -c mise run "$task"; done

  # Builds the package but uploads nothing: only `publish` may fill the cache.
  # The store paths no public cache has yet travel there as an artifact.
  nix:
    needs: assemble
    if: needs.assemble.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Use the Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: invition
          skipPush: true

      # strata-deps is every compiled dependency; with it cached, later builds
      # (here and on other machines) compile only the application.
      - name: Build the package
        run: |
          set -euo pipefail
          mkdir handoff
          nix build .#strata .#strata-deps --no-link --print-out-paths -L > handoff/outputs

      # nix-store -qR lists references first, the order --import needs.
      - name: Export the store paths no cache serves yet
        run: |
          set -euo pipefail
          cached() {
            local hash
            hash="$(basename "$1" | cut -c1-32)"
            curl -sf -o /dev/null "https://cache.nixos.org/$hash.narinfo" \
              || curl -sf -o /dev/null "https://invition.cachix.org/$hash.narinfo"
          }
          : > handoff/cached
          : > handoff/missing
          # shellcheck disable=SC2046
          for path in $(nix-store -qR $(cat handoff/outputs)); do
            if cached "$path"; then
              echo "$path" >> handoff/cached
            else
              echo "$path" >> handoff/missing
            fi
          done
          echo "Missing from the caches:"
          cat handoff/missing
          if [[ -s handoff/missing ]]; then
            # shellcheck disable=SC2046
            nix-store --export $(cat handoff/missing) \
              | nix shell --inputs-from . nixpkgs#zstd -c zstd -T0 > handoff/missing.nar.zst
          fi

      - name: Hand the build over to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-${{ matrix.system }}
          path: handoff
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Mirrors upstream's release.yml build so the archives match what the
  # updater and install.sh expect.
  binaries:
    needs: assemble
    if: needs.assemble.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.assemble.outputs.version_tag }}
      SOURCE_SHA: ${{ needs.assemble.outputs.sha }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false

      - name: Verify the source and set the build identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "VERSION=${TAG#v}"
            echo "STRATA_RELEASE_TAG=$TAG"
            echo "STRATA_BUILD_KIND=nightly"
            echo "STRATA_BUILD_COMMIT=$SOURCE_SHA"
            echo "RUST_VERSION=$(sed -nE 's/^rust = \{ version = "([^"]+)".*/\1/p' mise.toml)"
          } >> "$GITHUB_ENV"

      - name: Install native development libraries
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libgtk-4-dev libgtksourceview-5-dev libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release --locked --target "$TARGET"

      - name: Package binary
        run: |
          set -euo pipefail
          package="strata-${VERSION}-${TARGET}"
          mkdir -p "dist/$package"
          install -m 755 "target/$TARGET/release/strata" "dist/$package/strata"
          objcopy --only-keep-debug --compress-debug-sections=zlib "dist/$package/strata" "dist/$package.debug"
          strip --strip-unneeded "dist/$package/strata"
          objcopy --add-gnu-debuglink="dist/$package.debug" "dist/$package/strata"
          printf '%s\n' "$SOURCE_SHA" > "dist/$package/SOURCE_COMMIT"
          cp README.md LICENSE THIRD_PARTY_LICENSES.md data/licenses/UnRAR.txt "dist/$package/"
          mkdir -p "dist/$package/docs" "dist/$package/portal"
          cp docs/portal-file-chooser.md "dist/$package/docs/"
          cp data/portal/* "dist/$package/portal/"
          mkdir -p "dist/$package/udiskie"
          cp data/udiskie/* "dist/$package/udiskie/"
          install -m 644 data/io.github.lgse.Strata.desktop "dist/$package/"
          install -m 644 data/io.github.lgse.Strata.FileManager1.service "dist/$package/"
          install -m 644 data/icons/scalable/apps/io.github.lgse.Strata.svg "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          (cd dist && sha256sum "$package.debug" > "$package.debug.sha256")

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.debug
            dist/*.sha256
          if-no-files-found: error

  # Everything passed: fill the cache, attest, then move `release` and tag it,
  # and publish the GitHub Release. The branch moves only after the uploads
  # worked, so a failure before that leaves `release` untouched and the next
  # run retries; every step skips what an earlier attempt already did.
  publish:
    needs: [assemble, checks, nix, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
    env:
      SHA: ${{ needs.assemble.outputs.sha }}
      TAG: ${{ needs.assemble.outputs.tag }}
      VERSION_TAG: ${{ needs.assemble.outputs.version_tag }}
      PUBLISHED: ${{ needs.assemble.outputs.published }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the candidate with the sync token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_PAT }}
          persist-credentials: true
          ref: ${{ needs.assemble.outputs.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Use the Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: invition
          skipPush: true

      - name: Download the Nix builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nix-*
          path: handoff

      # Cachix skips paths cache.nixos.org already serves, so this uploads only
      # what the fork builds itself. Consumers hit it only when they evaluate the
      # same derivation: `release` with this flake.lock, no nixpkgs follows.
      - name: Upload the published packages to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for build in handoff/*/; do
            # An unsigned import needs its references in the store first.
            if [[ -s "$build/cached" ]]; then
              xargs nix-store --realise < "$build/cached" > /dev/null
            fi
            if [[ -f "$build/missing.nar.zst" ]]; then
              nix shell --inputs-from . nixpkgs#zstd -c zstd -dc "$build/missing.nar.zst" \
                | sudo env "PATH=$PATH" nix-store --import > /dev/null
            fi
            xargs nix-store --realise < "$build/outputs" | cachix push invition
          done

      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: strata-*
          path: dist
          merge-multiple: true

      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Move the release branch and tag it
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          if [[ "$current" != "$SHA" ]]; then
            manifest="$(sed '/^#/d' .release/manifest)"
            git tag -a "$TAG" -m "Fork release $TAG" -m "$manifest"
            git tag -a "$VERSION_TAG" -m "Fork release $TAG" -m "$manifest"
            git push --atomic "--force-with-lease=refs/heads/$RELEASE_BRANCH:$PUBLISHED" origin \
              "$SHA:refs/heads/$RELEASE_BRANCH" "refs/tags/$TAG" "refs/tags/$VERSION_TAG"
          fi
          git push origin --delete "$RELEASE_BRANCH-candidate" || true

      # Marked latest, not prerelease: install.sh resolves releases/latest, and
      # the nightly version suffix already keeps these off the Stable channel.
      - name: Publish the GitHub release
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          manifest="$(sed '/^#/d' .release/manifest)"
          notes="Fork build of [lgse/strata]($SERVER/lgse/strata): \`nix-dev\` plus the fork's feature branches.

          \`\`\`
          $manifest
          \`\`\`

          Nix users: see [NIX.md]($SERVER/$REPOSITORY/blob/nix-dev/NIX.md). Other distributions: download the archive for your architecture, or run \`install.sh\` from the \`release\` branch, which installs the latest fork release."
          gh release create "$VERSION_TAG" dist/* --repo "$REPOSITORY" --verify-tag --latest \
            --title "Strata $VERSION_TAG (fork)" --notes "$notes"

      - name: Close resolved release issues
        env:
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Release published: $RUN_URL"
          done

  report:
    needs: [assemble, checks, nix, binaries, publish]
    if: failure() && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Report the failed release in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.assemble.outputs.tag }}
          RESULTS: checks ${{ needs.checks.result }}, nix ${{ needs.nix.result }}, binaries ${{ needs.binaries.result }}, publish ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --color B60205 --description "Fork release assembly needs manual help" --force
          body="Release candidate \`$TAG\` was not fully published ($RESULTS).

          \`$RELEASE_BRANCH\` moves only after the Cachix upload and the attestation, so unless \`publish\` failed at its very end it was left untouched and the next run retries. If only the GitHub Release is missing, \"Re-run failed jobs\" creates it.

          Run: $RUN_URL"
          existing="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body "$body"
            gh issue comment "$existing" --body "Release failed again: $RUN_URL"
          else
            gh issue create --title "Fork release failed" --label "$ISSUE_LABEL" --body "$body"
          fi
